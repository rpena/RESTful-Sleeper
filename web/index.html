<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleeper Gameday Board</title>
  <style>
    body { margin: 0; min-width: 320px; background: #dfe9e6; color: #15232b; font-family: Georgia, serif; }
    .page { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 60px; }
    .topbar { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .brand { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #718087; }
    h1 { margin: 5px 0 0; font-size: clamp(32px, 6vw, 58px); font-weight: 500; }
    .controls { display: flex; flex-wrap: wrap; justify-content: end; gap: 8px; font: 13px sans-serif; }
    input, button { border: 1px solid #bfcfcb; border-radius: 8px; background: #fff; padding: 10px 12px; color: #15232b; }
    input { min-width: min(360px, 55vw); }
    button { cursor: pointer; font-weight: 700; }
    .hint { margin: -10px 0 18px; color: #718087; font: 13px sans-serif; }
    #content { background: #f7faf8; border: 1px solid #dce4e5; border-radius: 14px; padding: 22px; }
    @media (max-width: 700px) { .topbar { align-items: start; flex-direction: column; } .controls { justify-content: start; width: 100%; } input { min-width: 0; flex: 1; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><div id="league-name" class="brand">Sleeper league</div><h1>Gameday board</h1><div id="week-label" class="brand"></div></div>
      <form id="settings" class="controls"><input id="endpoint" type="text" value="/api/v1/dashboard" aria-label="Dashboard API endpoint"><button type="submit">Load</button><button id="refresh" type="button" title="Refresh dashboard data">Refresh</button></form>
    </header>
    <p class="hint">The page uses the same cached dashboard response as the Home Assistant card.</p>
    <div id="content"></div>
  </main>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
